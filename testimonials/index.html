  <main id="main" tabindex="-1"><header class="workspace-heading"><div><span class="eyebrow">CLIENT FEEDBACK / IN THEIR WORDS</span><h1 tabindex="-1">Good work is a collaboration.</h1><p>Perspectives from the people on the other side of the project.</p></div></header><div class="glass-panel feedback-panel" data-testimonials role="region" aria-label="Client testimonials" aria-roledescription="carousel" tabindex="0"><div class="panel-topline"><span class="panel-label">CLIENT FEEDBACK / PROJECT LOG</span><div class="feedback-controls"><button type="button" class="icon-button" data-feedback-prev aria-label="Previous testimonial"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><span data-feedback-count aria-live="polite">01 / 04</span><button type="button" class="icon-button" data-feedback-next aria-label="Next testimonial"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div></div><div class="feedback-slides"><figure class="feedback-slide" data-feedback-slide="0"><div class="feedback-quote-mark" aria-hidden="true">“</div><blockquote>You didn’t just build a website—you understood my brand on a deeper level. The structure, design, and flow all feel intentional and aligned with my coaching business.</blockquote><figcaption><span class="client-avatar">MG</span><div><cite>Margarita Grigoryan</cite><span>Founder, MG Transformation</span></div><span class="feedback-service">Website design &amp; development</span></figcaption><div class="feedback-links"><a class="text-link" href="../work/margarita-grigoryan/">View project <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a><a class="text-link" href="https://margaritagrigoryan.com/" target="_blank" rel="noopener">Visit website <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11M19 5 5 19"/></svg></a></div></figure><figure class="feedback-slide" data-feedback-slide="1"><div class="feedback-quote-mark" aria-hidden="true">“</div><blockquote>High-quality work and solid execution from start to finish. Francis is incredibly responsive, communicates well, and delivers quickly without sacrificing quality. He takes direction well, understands what you’re trying to achieve, and turns projects around fast. Reliable, professional, and someone I’d definitely work with again.</blockquote><figcaption><span class="client-avatar">AB</span><div><cite>Acerbox Builds</cite><span>acerboxbuilds.com</span></div><span class="feedback-service">Website design &amp; development</span></figcaption><div class="feedback-links"><a class="text-link" href="../work/acerbox-builds/">View project <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a><a class="text-link" href="https://acerboxbuilds.com/" target="_blank" rel="noopener">Visit website <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11M19 5 5 19"/></svg></a></div></figure><figure class="feedback-slide" data-feedback-slide="2"><div class="feedback-quote-mark" aria-hidden="true">“</div><blockquote>Francis is fast, talented, and genuinely great to work with. He really listens, takes feedback on board, and doesn’t just follow instructions, he also points out what could be improved and gives solid advice on what might be missing. You can tell he takes pride in his work, and the improvement from start to finish really showed. I hope his talent takes him far and reaches many more clients. I’d vouch for Francis any day. Highly recommended.</blockquote><figcaption><span class="client-avatar">DP</span><div><cite>Davis Pest Solutions</cite><span>davispestsol.co.nz</span></div><span class="feedback-service">Website design &amp; development</span></figcaption><div class="feedback-links"><a class="text-link" href="../work/davis-pest-solutions/">View project <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a><a class="text-link" href="https://davispestsol.co.nz/" target="_blank" rel="noopener">Visit website <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11M19 5 5 19"/></svg></a></div></figure><figure class="feedback-slide" data-feedback-slide="3"><div class="feedback-quote-mark" aria-hidden="true">“</div><blockquote>Working with Francis Rotol on the development of my website for Esperanza Coaching Collective was an exceptional experience.<br><br>Francis has a remarkable ability to take a vision and bring it to life in a way that feels both aligned and elevated. He was thoughtful, detail-oriented, and intentional in every aspect of the process—from design to functionality. I especially appreciated how he took the time to understand not just what I wanted visually, but the deeper purpose behind my work.<br><br>Throughout the project, he was responsive, collaborative, and solution-focused, making what could have felt overwhelming feel seamless and well-supported.<br><br>The final result is a website that is not only visually beautiful, but also intuitive, professional, and a true reflection of my brand.<br><br>I highly recommend Francis to anyone looking for a developer who combines technical expertise with genuine care for their clients and their vision.</blockquote><figcaption><span class="client-avatar">EC</span><div><cite>Esperanza Coaching Collective</cite><span>esperanzacoachingcollective.com</span></div><span class="feedback-service">Website design &amp; development</span></figcaption><div class="feedback-links"><a class="text-link" href="../work/esperanza-coaching/">View project <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a><a class="text-link" href="https://esperanzacoachingcollective.com/" target="_blank" rel="noopener">Visit website <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h11v11M19 5 5 19"/></svg></a></div></figure></div><div class="feedback-selectors"><button type="button" data-feedback-select="0" aria-pressed="true">Margarita Grigoryan</button><button type="button" data-feedback-select="1" aria-pressed="false">Acerbox Builds</button><button type="button" data-feedback-select="2" aria-pressed="false">Davis Pest Solutions</button><button type="button" data-feedback-select="3" aria-pressed="false">Esperanza Coaching Collective</button></div></div><div class="glass-panel inline-cta"><div><h3>Your project could be next.</h3><p>Let’s talk about what a useful result looks like for your business.</p></div><a class="button button-primary" href="../contact/">Start a project<svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor
